spring.application.name=Trackademy
# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:mysql://localhost:3306/trackademydb?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=crosemont

# Hibernate
#Le dialecte SQL permet ? Hibernate de g?n?rer un meilleur SQL pour la base de donn?es choisie
#pour trouver la bonne classe de num?rotation de la base de donn?es pour Mysql
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
#pour afficher les instructions sql sur la console
spring.jpa.show-sql=false
#pour rendre les instructions sql plus lisibles sur la console
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Encodage
spring.servlet.encoding.charset=UTF-8
spring.server.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

server.port=8080

# JWT (API /api/**)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-prod-min-32-chars}
jwt.expiration-ms=86400000

# Courriel (mot de passe oublié) - si non configuré, le lien de réinitialisation
# est simplement écrit dans les logs du serveur au lieu d'être envoyé par courriel
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=${APP_BASE_URL:http://localhost:8080}

# OAuth2 - Connexion Google
# (noms hors du préfixe spring.security.oauth2.client.* : l'auto-configuration Spring Boot
#  valide sinon un client-id non vide au démarrage, même quand Google n'est pas encore configuré)
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}

